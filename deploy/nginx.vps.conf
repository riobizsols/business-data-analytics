# Internal proxy inside the bda compose stack.
# The host reverse proxy (TLS) forwards bda.rioassetmanagement.net here.

upstream bda_api { server api:8000; keepalive 16; }
upstream bda_web { server web:3000; keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Keep the real client IP passed from the host proxy.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://bda_api;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/export/ {
        proxy_pass http://bda_api;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://bda_api;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://bda_web;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://bda_web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
