# bda.rioassetmanagement.net -> bda stack (172.17.0.1:8095)
# Appended to /root/alm-main/nginx/nginx-ssl.conf, which the alm_nginx container loads.
# The exact server_name takes priority over the tenant wildcard/regex server blocks.
# Uses the existing *.rioassetmanagement.net certificate mounted into alm_nginx.

server {
    listen 80;
    server_name bda.rioassetmanagement.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bda.rioassetmanagement.net;

    ssl_certificate     /etc/nginx/ssl/fullchain-wildcard.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey-wildcard.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://172.17.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
