# Host nginx site for bda.rioassetmanagement.net
# Install: sudo cp deploy/host-nginx-bda.conf /etc/nginx/sites-available/bda.rioassetmanagement.net
#          sudo ln -s /etc/nginx/sites-available/bda.rioassetmanagement.net /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d bda.rioassetmanagement.net
# Keep the port below in sync with BDA_HTTP_PORT in deploy/vps.env.

server {
    listen 80;
    listen [::]:80;
    server_name bda.rioassetmanagement.net;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
